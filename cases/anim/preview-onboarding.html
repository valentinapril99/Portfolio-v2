<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Онбординг КуулКлевер — превью</title>
<style>
:root{
  --page:#e9ece4; --ink:#1d2116; --muted:#5d6553; --track:#c9cfbf; --fill:#6aa61f; --btn:#ffffff; --btn-line:#c9cfbf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#16180f; --ink:#eef1e8; --muted:#a3ab97; --track:#3a3f31; --fill:#8fcf3a; --btn:#24271d; --btn-line:#3a3f31; color-scheme:dark; }
}
:root[data-theme="dark"]{ --page:#16180f; --ink:#eef1e8; --muted:#a3ab97; --track:#3a3f31; --fill:#8fcf3a; --btn:#24271d; --btn-line:#3a3f31; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px 16px 8px}
#fit{position:relative;overflow:hidden;border-radius:10px}
#scene{position:absolute;left:0;top:0;width:1500px;height:898px;transform-origin:0 0;overflow:hidden;
  background:#fff linear-gradient(158.6deg, rgb(226,232,245) 4.2%, rgb(208,210,238) 98.5%)}
.phone{position:absolute;transform-origin:50% 50%}
.phone > img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.screen{position:absolute;left:0;top:0;width:402px;height:874px;transform-origin:0 0;backface-visibility:hidden}
.screen img{position:absolute;display:block;max-width:none;pointer-events:none;user-select:none}
.ly{position:absolute;transform-origin:50% 50%}
.ly > img{left:0;top:0;width:100%;height:100%}
.clip{position:absolute;left:0;overflow:hidden}
.filler{position:absolute;left:0;width:402px;background:#fff}
.hl{position:absolute;border-radius:16px;background:rgba(118,183,30,.14)}
.glow{position:absolute;inset:0;border-radius:12px;background:rgba(150,205,70,.38)}
.sb{position:absolute}  /* статус-бар ui-lock-top: положение и размер из макета 771:53156 */
.rm-only{display:none}
html.rm .rm-only{display:block}
.shine{position:absolute;top:-10px;left:0;width:90px;height:70px;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%)}
#controls{display:flex;align-items:center;gap:10px;padding:8px 16px 16px;max-width:760px;width:100%;margin:0 auto}
#controls button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--btn-line);border-radius:8px;height:34px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
#controls button:focus-visible,#bar:focus-visible{outline:2px solid var(--fill);outline-offset:2px}
#controls svg{width:12px;height:12px;fill:currentColor}
#bar{flex:1;min-width:60px;height:22px;position:relative;cursor:pointer;touch-action:none}
#bar::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--track)}
#barFill{position:absolute;left:0;top:9px;height:4px;width:100%;border-radius:2px;background:var(--fill);transform-origin:0 50%;transform:scaleX(0)}
#time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:76px;text-align:right}

.ly > img, .img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.cscale{position:absolute;left:0;top:0;width:1193px;height:1900px;transform-origin:0 0;transform:scale(0.376362)}
</style>

<script>
/* ===================== ТАЙМЛАЙН =====================
   t: [начало, конец] в секундах; el: id слоя;
   свойства: x/y (px слоя), s (scale), r (поворот, град), o (opacity);
   значение — [от, до] или ключевые кадры [a, b, c] (равномерно). */
const TIMELINE = [
  /* центральный телефон: кадр 1 */
  { t:[0.45,0.70], el:'field',  ease:'scroll', s:[1,0.97,1] },          // нажатие на поле номера
  { t:[0.62,0.66], el:'caret',  o:[0,1] },
  /* ввод номера: +7 (973) 450 18 12 — по одной цифре каждые 150 мс */
  { t:[0.75,0.83], el:'prefix', ease:'appear', o:[0,1] },
  { t:[0.75,0.95], el:'clear',  ease:'appear', o:[0,1], s:[0.6,1] },
  { t:[0.75,0.84], el:'d1', ease:'appear', o:[0,1], y:[8,0] },
  { t:[0.75,0.751], el:'caret', x:[-306,-278] },
  { t:[0.90,0.99], el:'d2', ease:'appear', o:[0,1], y:[8,0] },
  { t:[0.90,0.901], el:'caret', x:[-278,-254] },
  { t:[1.05,1.14], el:'d3', ease:'appear', o:[0,1], y:[8,0] },
  { t:[1.05,1.051], el:'caret', x:[-254,-226] },
  { t:[1.20,1.29], el:'d4', ease:'appear', o:[0,1], y:[8,0] },
  { t:[1.20,1.201], el:'caret', x:[-226,-172] },
  { t:[1.35,1.44], el:'d5', ease:'appear', o:[0,1], y:[8,0] },
  { t:[1.35,1.351], el:'caret', x:[-172,-144] },
  { t:[1.50,1.59], el:'d6', ease:'appear', o:[0,1], y:[8,0] },
  { t:[1.50,1.501], el:'caret', x:[-144,-116] },
  { t:[1.65,1.74], el:'d7', ease:'appear', o:[0,1], y:[8,0] },
  { t:[1.65,1.651], el:'caret', x:[-116,-89] },
  { t:[1.80,1.89], el:'d8', ease:'appear', o:[0,1], y:[8,0] },
  { t:[1.80,1.801], el:'caret', x:[-89,-57] },
  { t:[1.95,2.04], el:'d9', ease:'appear', o:[0,1], y:[8,0] },
  { t:[1.95,1.951], el:'caret', x:[-57,-31] },
  { t:[2.10,2.19], el:'d10', ease:'appear', o:[0,1], y:[8,0] },
  { t:[2.10,2.101], el:'caret', x:[-31,0] },
  { t:[1.95,2.30], el:'chip',   ease:'appear', o:[0,1,1], s:[0.6,1.06,1], y:[10,0,0] },   // 9 цифр — приветствие
  { t:[2.10,2.30], el:'btn1',   ease:'appear', o:[0,1] },                // 10 цифр — кнопка активна
  { t:[2.10,2.30], el:'btn0',   ease:'appear', o:[1,0] },
  { t:[2.35,2.36], el:'caret',  o:[1,0] },
  { t:[2.45,2.75], el:'btn1',   ease:'scroll', s:[1,0.95,1] },          // нажатие «Отправить код»
  { t:[2.60,2.61], el:'caret',  o:[0,1] },
  /* кадр 4: телефоны выходят из-за центрального */
  { t:[2.70,3.50], el:'phoneL', ease:'appear', x:[260,0], y:[20,0], s:[0.88,1], r:[4,0] },
  { t:[2.70,2.95], el:'phoneL', ease:'appear', o:[0,1] },
  { t:[2.75,3.50], el:'phoneR', ease:'appear', x:[-260,0], y:[20,0], s:[0.88,1], r:[-4,0] },
  { t:[2.75,3.00], el:'phoneR', ease:'appear', o:[0,1] },
  { t:[2.80,3.40], el:'glow',   ease:'appear', o:[0,1] },
];
const DURATION = 4.0;

/* ---------- easing ---------- */
function bezier(x1,y1,x2,y2){
  const cx=3*x1, bx=3*(x2-x1)-cx, ax=1-cx-bx, cy=3*y1, by=3*(y2-y1)-cy, ay=1-cy-by;
  const X=t=>((ax*t+bx)*t+cx)*t, Y=t=>((ay*t+by)*t+cy)*t, dX=t=>(3*ax*t+2*bx)*t+cx;
  return p=>{ if(p<=0) return 0; if(p>=1) return 1;
    let t=p; for(let i=0;i<8;i++){ const d=dX(t); if(Math.abs(d)<1e-6) break; t-= (X(t)-p)/d; }
    if(t<0||t>1){ let lo=0,hi=1; t=p; for(let i=0;i<30;i++){ X(t)<p?lo=t:hi=t; t=(lo+hi)/2; } }
    return Y(t); };
}
const EASE = { appear:bezier(0.2,0.8,0.2,1), scroll:bezier(0.65,0,0.35,1), linear:p=>p };
const inOutSine = p => -(Math.cos(Math.PI*p)-1)/2;

/* ---------- движок ---------- */
const MOTION = ['x','y','s','r','ry'];
const DEF = {x:0,y:0,s:1,r:0,ry:0,o:1};
const steps = TIMELINE.map((st,i)=>({...st,i})).sort((a,b)=>a.t[0]-b.t[0]||a.i-b.i);
const targets = {};
for(const st of steps){ (targets[st.el] ||= { node:document.getElementById(st.el), steps:[] }).steps.push(st); }
for(const k in targets) targets[k].tf = targets[k].node.dataset.tf || '';

function sample(vals,p,ease){
  const n=vals.length-1; if(p<=0) return vals[0]; if(p>=1) return vals[n];
  const seg=Math.min(n-1,Math.floor(p*n)), lp=p*n-seg;
  return vals[seg]+(vals[seg+1]-vals[seg])*ease(lp);
}
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = reduceMQ.matches;

function stateAt(tg,t){
  const v={...DEF}, set={};
  for(const st of tg.steps){
    const [t0,t1]=st.t, p=Math.max(0,Math.min(1,(t-t0)/(t1-t0))), ease=EASE[st.ease||'linear'];
    if(st.wave){ if(!reduced && t>t0 && t<t1) for(const k in st.wave) v[k]+=st.wave[k]*Math.sin(2*Math.PI*inOutSine(p)); continue; }
    for(const k of ['x','y','s','r','ry','o']){
      const vals=st[k]; if(!vals) continue;
      const motion=MOTION.includes(k);
      if(reduced && motion){ v[k]=vals[vals.length-1]; set[k]=1; continue; }
      if(t<t0){ if(!set[k]){ v[k]=vals[0]; set[k]=1; } continue; }
      v[k]=sample(vals,p,ease); set[k]=1;
    }
  }
  return v;
}
function render(t){
  for(const k in targets){
    const tg=targets[k], v=stateAt(tg,t), n=tg.node.style;
    let tf=`translate3d(${v.x.toFixed(3)}px,${v.y.toFixed(3)}px,0)`;
    if(v.ry) tf+=` perspective(1400px) rotateY(${v.ry.toFixed(3)}deg)`;
    if(v.r) tf+=` rotate(${v.r.toFixed(3)}deg)`;
    if(v.s!==1) tf+=` scale(${v.s.toFixed(4)})`;
    if(tg.tf) tf+=' '+tg.tf;
    n.transform=tf; n.opacity=v.o.toFixed(3);
  }
  const p=t/DURATION;
  barFill.style.transform=`scaleX(${p})`;
  bar.setAttribute('aria-valuenow',t.toFixed(2));
  timeEl.textContent=`${t.toFixed(2)} / ${DURATION.toFixed(2)} с`;
}

/* ---------- масштаб сцены ---------- */
const scene=document.getElementById('scene'), fit=document.getElementById('fit'), stage=document.getElementById('stage');
function resize(){
  const cs=getComputedStyle(stage);
  const w=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const h=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const k=Math.max(0.05,Math.max(w/1500,h/898));  /* заполнить карточку целиком */
  fit.style.width=1500*k+'px'; fit.style.height=898*k+'px';
  scene.style.transform=`scale(${k})`;
}
addEventListener('resize',resize); resize();

/* ---------- плеер ---------- */
const playBtn=document.getElementById('play'), playLabel=document.getElementById('playLabel'), playIcon=document.getElementById('playIcon');
const bar=document.getElementById('bar'), barFill=document.getElementById('barFill'), timeEl=document.getElementById('time');
let time=0, playing=false, last=0, raf=0;
const ICON_PAUSE='<rect x="1.5" y="1" width="3" height="10" rx=".6"/><rect x="7.5" y="1" width="3" height="10" rx=".6"/>';
const ICON_PLAY='<path d="M2.5 1.2v9.6c0 .5.5.8.9.5l7.6-4.8c.4-.2.4-.8 0-1L3.4.7c-.4-.3-.9 0-.9.5z"/>';
function setPlaying(on){
  playing=on;
  playLabel.textContent=on?'Pause':'Play'; playBtn.setAttribute('aria-label',on?'Pause':'Play');
  playIcon.innerHTML=on?ICON_PAUSE:ICON_PLAY;
  cancelAnimationFrame(raf);
  if(on){ last=performance.now(); raf=requestAnimationFrame(tick); }
}
function tick(now){
  time=Math.min(DURATION,time+(now-last)/1000); last=now; render(time);
  if(time>=DURATION){ time=0; }  /* на сайте превью идёт по кругу */
  raf=requestAnimationFrame(tick);
}
playBtn.addEventListener('click',()=>{ if(!playing && time>=DURATION) time=0; setPlaying(!playing); });
document.getElementById('restart').addEventListener('click',()=>{ time=0; render(0); setPlaying(true); });
function seekFromEvent(e){ const r=bar.getBoundingClientRect(); time=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*DURATION; render(time); }
bar.addEventListener('pointerdown',e=>{ setPlaying(false); bar.setPointerCapture(e.pointerId); seekFromEvent(e); });
bar.addEventListener('pointermove',e=>{ if(bar.hasPointerCapture(e.pointerId)) seekFromEvent(e); });
bar.addEventListener('keydown',e=>{
  const d={ArrowRight:0.1,ArrowLeft:-0.1,Home:-DURATION,End:DURATION}[e.key]; if(d===undefined) return;
  e.preventDefault(); setPlaying(false); time=Math.max(0,Math.min(DURATION,time+d)); render(time);
});
function applyRM(){ document.documentElement.classList.toggle('rm',reduced); }
