<title>Черная сумка</title>
<style>
:root{
  --page:#E9ECF2; --ui:#1E1E1E; --muted:#6B7280; --btn:#ffffff; --line:#D3D8E0; --accent:#111111; --accent-ink:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--page:#111316;--ui:#ECEEF1;--muted:#9AA1AC;--btn:#1E2126;--line:#33373E;--accent:#ECEEF1;--accent-ink:#111316}
}
:root[data-theme="dark"]{color-scheme:dark;--page:#111316;--ui:#ECEEF1;--muted:#9AA1AC;--btn:#1E2126;--line:#33373E;--accent:#ECEEF1;--accent-ink:#111316}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ui);font:15px/1.4 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;overflow-x:hidden}
#fit{position:relative;flex:none;border-radius:18px;overflow:hidden}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;font-family:var(--title-font)}
.bg{position:absolute;inset:0}
#persp{position:absolute;inset:0;perspective:2600px}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#device{position:absolute;will-change:opacity}
#frame{position:absolute;inset:0}
#screen{position:absolute;overflow:hidden;isolation:isolate}
.scr{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.scr img,.spot img,.callout img{position:absolute;left:0;display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.fx{position:absolute;left:0;right:0;overflow:hidden}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.spot,.callout{position:absolute;overflow:hidden;opacity:0;transform-origin:50% 50%}
.callout{z-index:5}
.tap{position:absolute;opacity:0;pointer-events:none;border-radius:50%;z-index:6}
.cursor{position:absolute;opacity:0;pointer-events:none;z-index:6;width:34px;height:34px;transform-origin:30% 10%}
#island{position:absolute;background:#000;border-radius:999px}
#titles{position:absolute;inset:0;pointer-events:none}
.title{position:absolute;left:6%;right:6%;text-align:center;opacity:0;font-weight:700;letter-spacing:-0.02em;line-height:1.05}
.title .w{display:inline-block;will-change:transform,opacity}
.title .sub{display:block;font-weight:500;letter-spacing:0;margin-top:.5em;font-size:.36em;opacity:.75}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.controls button{font:inherit;font-weight:500;color:var(--ui);background:var(--btn);border:1px solid var(--line);border-radius:12px;height:40px;padding:0 14px;cursor:pointer;white-space:nowrap}
.controls button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:96px}
.controls button:focus-visible,.controls input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#seek{flex:1;min-width:120px;accent-color:var(--accent)}
.vol{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
#sound{display:none!important}
.controls .volbtn{min-width:0;border:0;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ui);cursor:pointer}
.controls .volbtn:hover{background:var(--btn)}.volbtn svg{width:20px!important;height:20px!important;flex:none}
.volbtn .off{display:none}.volbtn.is-muted .off{display:inline}.volbtn.is-muted .on{display:none}
#vol{width:72px;accent-color:var(--accent)}.vol{margin-right:14px;padding-right:14px;border-right:1px solid var(--line)}
#time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:92px;text-align:right;font-size:14px}
body.render{padding:0;display:block;background:transparent}
body.render .controls{display:none}
body.render #fit{border-radius:0}
</style>

<script>
(function(){
"use strict";
const C = window.CONFIG;
const W = C.canvas.w, H = C.canvas.h;
const D = Object.assign({w:393,h:852,bezel:14,radius:55,frame:'#1C1C1E',edge:'#3A3A3C',island:true,shadow:'0 50px 120px rgba(0,0,0,.28)'}, C.device||{});
const SW = D.w, SH = D.h, BZ = D.bezel;
const BPM = (C.audio && C.audio.bpm) || 112, SPB = 60/BPM, BOFF = (C.audio && C.audio.beatOffset) || 0;
const FIT_H = C.fitHeight || 0.86;                // device height as share of canvas at zoom 1
const S0 = Math.min(H*FIT_H/(SH+2*BZ), W*0.92/(SW+2*BZ));
const RENDER = /[?&]render=1/.test(location.search);
const $ = id => document.getElementById(id);

// ---------------- easing ----------------
function bez(x1,y1,x2,y2){
  const A=(a,b)=>1-3*b+3*a, B=(a,b)=>3*b-6*a, Cc=a=>3*a;
  const f=(t,a,b)=>((A(a,b)*t+B(a,b))*t+Cc(a))*t, d=(t,a,b)=>3*A(a,b)*t*t+2*B(a,b)*t+Cc(a);
  return x=>{ if(x<=0)return 0; if(x>=1)return 1; let t=x;
    for(let i=0;i<8;i++){const s=d(t,x1,x2); if(Math.abs(s)<1e-6)break; t-=(f(t,x1,x2)-x)/s;}
    let lo=0,hi=1; for(let j=0;j<24&&Math.abs(f(t,x1,x2)-x)>1e-5;j++){ if(f(t,x1,x2)<x)lo=t; else hi=t; t=(lo+hi)/2; }
    return f(t,y1,y2); };
}
const EASE = {
  linear:u=>u, inOut:bez(.65,0,.35,1), out:bez(.2,.8,.2,1), in:bez(.5,0,.75,0),
  snappy:bez(.7,0,.1,1),            // fast punch-in zoom (Telegram-style)
  smooth:bez(.45,0,.2,1),           // slow cinematic camera
  spring:u=>{ if(u<=0)return 0; if(u>=1)return 1; const c=1.4; return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2); }
};
const ez = n => EASE[n] || EASE.inOut;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), seg=(t,a,b)=>clamp((t-a)/(b-a),0,1), lerp=(a,b,u)=>a+(b-a)*u;

// ---------------- timeline normalisation ----------------
const DEF = {camera:.7, scroll:.9, show:0, transition:.45, tap:.35, swipe:.7, spotlight:1.8, callout:2.6, title:1.8, enter:.9, exit:.6, bg:.8, sfx:0, wait:0};
const ACTS=[]; let prevStart=0, prevEnd=0;
for(const raw of C.timeline){
  const a=Object.assign({},raw);
  a.dur = a.dur!=null ? a.dur : (DEF[a.do]!=null?DEF[a.do]:0);
  let t=a.t; if(t==null) t='+0';
  if(typeof t==='string'){
    if(t[0]==='b') t=parseFloat(t.slice(1))*SPB+BOFF;
    else if(t[0]==='+') t=prevEnd+parseFloat(t.slice(1)||0);
    else if(t[0]==='=') t=prevStart+parseFloat(t.slice(1)||0);
    else t=parseFloat(t);
  }

let actx=null;

{ const vr=document.getElementById('vol'); window.VOL=vr.value/100;
